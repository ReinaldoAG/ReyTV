name: Compilar ISO de ReyTV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-iso.yml'
      - 'iso/**'
      - 'linux/reytv-launch'
      - 'linux/reytv-update'
      - 'linux/reytv-rollback'
      - 'linux/systemd/**'
      - 'index.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Obtener ReyTV
        uses: actions/checkout@v4

      - name: Comprobar integridad de fuentes
        run: bash tests/iso-smoke.sh

      - name: Compilar sistema y su instalador con Debian 13
        run: |
          # Ubuntu 24.04 tiene live-build 3.0, incompatible con los argumentos
          # de live-build de Debian 13. Compilamos dentro de Debian trixie.
          mkdir -p "$RUNNER_TEMP/reytv-build"
          docker run --rm --privileged \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/reytv-build,target=/build" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools ca-certificates
              lb --version
              bash /src/iso/build.sh /build
              xorriso -indev /build/reytv-amd64.hybrid.iso -report_el_torito plain
            '

      - name: Validar integridad y opciones de arranque de la ISO
        run: |
          cd "$RUNNER_TEMP/reytv-build"
          sha256sum --check reytv-amd64.hybrid.iso.sha256
          test "$(stat -c %s reytv-amd64.hybrid.iso)" -gt 100000000

      - name: Publicar ISO descargable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ReyTV-${{ github.ref_name }}-amd64-ISO
          path: |
            ${{ runner.temp }}/reytv-build/reytv-amd64.hybrid.iso
            ${{ runner.temp }}/reytv-build/reytv-amd64.hybrid.iso.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
