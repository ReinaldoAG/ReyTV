name: Validar ajustes nativos ReyTV

on:
  push:
    branches: [main, feature/native-settings-0-4, feature/gui-installer-and-full-updater, feature/network-update-042, feature/tv-settings-043, feature/tv-experience-044, feature/back-navigation-045, feature/external-keyboard-046, feature/quiet-tv-047]
    paths:
      - 'linux/reytv-server.py'
      - 'linux/reytv-native.py'
      - 'linux/reytv-install-tv.sh'
      - 'linux/reytv-update'
      - 'linux/reytv-rollback'
      - 'linux/reytv-gui-setup.sh'
      - 'Instalar-ReyTV.desktop'
      - 'linux/reytv-enable-updates.sh'
      - 'index.html'
      - 'tests/test_*.py'
      - '.github/workflows/native-settings-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis Python y scripts
        run: |
          python3 -m py_compile linux/reytv-server.py linux/reytv-native.py
          bash -n linux/reytv-install-tv.sh linux/reytv-enable-updates.sh linux/reytv-update linux/reytv-rollback linux/reytv-gui-setup.sh
      - name: Pruebas de seguridad y parámetros
        run: python3 -m unittest discover -s tests -p 'test_native*.py' -v
      - name: Prueba de actualización completa y recuperación
        run: python3 -m unittest discover -s tests -p 'test_full_updater.py' -v
      - name: Validar JavaScript del menú
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          script = re.search(r'<script>([\s\S]*?)</script>', html)
          assert script, "No se encontró JS"
          Path('/tmp/reytv-script.js').write_text(script.group(1))
          assert 'settings-categories' in html
          assert 'data-native-tab=' not in html
          assert 'ReyTV · 0.4.7' in html
          PY
          node --check /tmp/reytv-script.js
      - name: Navegación en TV con Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
          python3 tests/test_tv_settings_browser.py
      - name: Navegación de mouse sobre aplicaciones externas X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openbox xdotool xvfb libxtst6
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tests/test_quiet_profile.py
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tests/test_mouse_overlay.py
