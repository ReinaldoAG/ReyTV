name: Diagnosticar arranque de ISO ReyTV

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID del workflow que generó la ISO'
        required: false
        default: '44654126010'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-iso.yml'
      - 'tests/iso-boot-smoke.sh'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener scripts de ReyTV
        uses: actions/checkout@v4

      - name: Descargar ISO original sin recompilar
        uses: actions/download-artifact@v4
        with:
          name: ReyTV-main-amd64-ISO
          run-id: ${{ inputs.run_id || '44654126010' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/reytv-original

      - name: Inspeccionar initrd y ejecutar Live en QEMU (Debian)
        run: |
          # Usamos el mismo Debian que genera la ISO: en Ubuntu la descarga
          # de paquetes quedó bloqueada durante varios minutos.
          mkdir -p "$RUNNER_TEMP/reytv-diagnosis"
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/reytv-original,target=/iso,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/reytv-diagnosis,target=/reports" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euc '
              timeout 150 apt-get update
              timeout 150 apt-get install -y --no-install-recommends \
                xorriso initramfs-tools-core qemu-system-x86
              bash /src/tests/iso-boot-smoke.sh \
                /iso/reytv-amd64.hybrid.iso /reports
            '

